<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f5f4" />
    </linearGradient>
    <linearGradient id="greenArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b5e28" />
      <stop offset="50%" stop-color="#1eb854" />
      <stop offset="100%" stop-color="#2ed86e" />
    </linearGradient>
    <linearGradient id="mainCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c18" />
      <stop offset="65%" stop-color="#1b2923" />
      <stop offset="100%" stop-color="#0e6c31" />
    </linearGradient>
  </defs>

  <!-- Fondo tipo App Icon con bordes redondeados -->
  <rect width="512" height="512" rx="115" fill="url(#appBg)" />

  <!-- Círculo exterior -->
  <path d="M 245 68 A 185 185 0 1 0 255 438" fill="none" stroke="url(#mainCircle)" stroke-width="32" stroke-linecap="round"/>
  <path d="M 245 68 A 185 185 0 0 1 385 130" fill="none" stroke="#168b42" stroke-width="30" stroke-linecap="round"/>

  <!-- Letra B -->
  <text x="135" y="342" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="255" font-weight="900" fill="#141c18">B</text>

  <!-- Flecha Dinámica Ascendente -->
  <path d="M 180 385 Q 305 358 395 205" fill="none" stroke="url(#greenArrow)" stroke-width="26" stroke-linecap="round"/>
  <polygon points="368,180 442,160 418,235" fill="#1eb854" />

  <!-- 4 Barras de Crecimiento -->
  <rect x="250" y="375" width="28" height="52" rx="7" fill="#0f6b30"/>
  <rect x="295" y="342" width="28" height="85" rx="7" fill="#14833c"/>
  <rect x="340" y="308" width="28" height="119" rx="7" fill="#1ba44c"/>
  <rect x="385" y="270" width="28" height="157" rx="7" fill="#24c45a"/>
</svg>
